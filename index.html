<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IA Esfera</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040a;color:#eaffff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{background:radial-gradient(circle at 50% 42%,#08243a 0,#030914 42%,#010207 80%)}#scene{position:fixed;inset:0}.top{position:fixed;z-index:4;top:max(20px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}.title{font-size:12px;letter-spacing:.35em;color:#a5fbff}.status{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:7px 12px;border:1px solid #5eeeff38;border-radius:999px;background:#06101db8;backdrop-filter:blur(12px);font-size:11px;letter-spacing:.12em}.dot{width:7px;height:7px;border-radius:50%;background:#67fff0;box-shadow:0 0 14px #67fff0}.reply{position:fixed;z-index:4;left:20px;right:20px;bottom:165px;max-width:620px;margin:auto;text-align:center;font-size:16px;line-height:1.45;opacity:0;transform:translateY(8px);transition:.3s;text-shadow:0 2px 18px #000}.reply.show{opacity:1;transform:none}.hint{position:fixed;z-index:3;left:20px;right:20px;bottom:110px;text-align:center;color:#d9fbff9c;font-size:13px}.panel{position:fixed;z-index:5;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));max-width:680px;margin:auto;padding:9px;border:1px solid #6cf1ff2e;border-radius:22px;background:#06101dc9;backdrop-filter:blur(18px);display:flex;gap:8px}.input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:16px;padding:0 10px}.input::placeholder{color:#71909a}.btn{width:48px;height:48px;border:1px solid #68efff3d;border-radius:16px;background:linear-gradient(145deg,#12647b99,#09263da8);color:#e8ffff;font-size:20px;display:grid;place-items:center}.btn:active{transform:scale(.96)}#send{background:linear-gradient(145deg,#27bdca,#0c637c)}@media(max-height:650px){.hint{bottom:90px}.reply{bottom:142px}.btn{height:44px;width:44px}}</style></head><body><div id="scene"></div><div class="top"><div class="title">IA • ESFERA</div><div class="status"><span class="dot"></span><span id="status">SISTEMA ONLINE</span></div></div><div id="reply" class="reply"></div><div class="hint">Toque no microfone ou escreva para conversar</div><div class="panel"><button id="mic" class="btn" aria-label="Microfone">◉</button><input id="input" class="input" placeholder="Fale ou escreva..." autocomplete="off"><button id="send" class="btn" aria-label="Enviar">➤</button></div><script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><script>(()=>{const mount=document.querySelector('#scene'),status=document.querySelector('#status'),reply=document.querySelector('#reply'),input=document.querySelector('#input'),mic=document.querySelector('#mic'),send=document.querySelector('#send');const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.z=7.2;const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);mount.appendChild(renderer.domElement);const group=new THREE.Group();scene.add(group);const geo=new THREE.IcosahedronGeometry(1.65,5),pos=geo.attributes.position,original=new Float32Array(pos.array);const shell=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x5eeeff,wireframe:true,transparent:true,opacity:.38,blending:THREE.AdditiveBlending}));group.add(shell);group.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.39,4),new THREE.MeshBasicMaterial({color:0x062638,transparent:true,opacity:.75})));const core=new THREE.Mesh(new THREE.SphereGeometry(.42,32,32),new THREE.MeshBasicMaterial({color:0x72fff4,transparent:true,opacity:.85,blending:THREE.AdditiveBlending}));group.add(core);
const halo=new THREE.Group();group.add(halo);function particleCloud(count,minR,maxR,size,color,opacity){const g=new THREE.BufferGeometry(),a=new Float32Array(count*3);for(let i=0;i<count;i++){const r=minR+Math.random()*(maxR-minR),th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);a[i*3]=r*Math.sin(ph)*Math.cos(th);a[i*3+1]=r*Math.sin(ph)*Math.sin(th);a[i*3+2]=r*Math.cos(ph)}g.setAttribute('position',new THREE.BufferAttribute(a,3));const p=new THREE.Points(g,new THREE.PointsMaterial({color,size,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false}));halo.add(p);return p}const dust=particleCloud(1200,2.35,3.65,.032,0x55eaff,.72),spark=particleCloud(180,2.55,3.9,.075,0x8d7cff,.8),glints=particleCloud(90,2.7,4.15,.11,0xd8ffff,.65);
const sg=new THREE.BufferGeometry(),n=420,a=new Float32Array(n*3);for(let i=0;i<n;i++){const rad=6+Math.random()*9,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);a[i*3]=rad*Math.sin(ph)*Math.cos(th);a[i*3+1]=rad*Math.sin(ph)*Math.sin(th);a[i*3+2]=rad*Math.cos(ph)}sg.setAttribute('position',new THREE.BufferAttribute(a,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0x70dce8,size:.025,transparent:true,opacity:.3}));scene.add(stars);let mode='idle',clock=new THREE.Clock();const modes={idle:['SISTEMA ONLINE',.035],listening:['OUVINDO...',.09],thinking:['PENSANDO...',.07],speaking:['FALANDO...',.18]};function setMode(m){mode=m;status.textContent=modes[m][0]}function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),amp=modes[mode][1];group.rotation.y+=mode==='thinking'?.008:.003;group.rotation.x=Math.sin(t*.22)*.08;halo.rotation.y-=mode==='thinking'?.006:.0014;halo.rotation.z=Math.sin(t*.12)*.08;dust.material.opacity=.6+Math.sin(t*1.3)*.12;spark.material.opacity=.68+Math.sin(t*2.1)*.16;glints.material.opacity=.52+Math.sin(t*2.7)*.13;for(let i=0;i<pos.count;i++){const k=i*3,x=original[k],y=original[k+1],z=original[k+2],noise=Math.sin(x*3+t*2)+Math.sin(y*4-t*1.7)+Math.sin(z*3.5+t*1.3),talk=mode==='speaking'?Math.abs(Math.sin(t*15+i))*.08:0,s=1+noise*.012+amp*.15+talk;pos.array[k]=x*s;pos.array[k+1]=y*s;pos.array[k+2]=z*s}pos.needsUpdate=true;core.scale.setScalar(1+Math.sin(t*3)*.08+(mode==='speaking'?Math.abs(Math.sin(t*12))*.3:0));renderer.render(scene,camera)}animate();function show(t){reply.textContent=t;reply.classList.add('show')}const answers=['Estou aqui. Esta é uma demonstração da esfera interativa.','Entendi. Estou processando sua mensagem.','A esfera muda de comportamento enquanto ouve, pensa e fala.','Este protótipo está separado dos seus outros projetos. Podemos experimentar à vontade.'];function speak(text){show(text);setMode('speaking');if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.onend=()=>{setMode('idle');setTimeout(()=>reply.classList.remove('show'),2500)};u.onerror=()=>setMode('idle');speechSynthesis.speak(u)}else setTimeout(()=>setMode('idle'),1800)}function processText(t){t=(t||'').trim();if(!t)return;input.value='';show('...');setMode('thinking');setTimeout(()=>{let a=/oi|olá|ola|bom dia|boa noite/i.test(t)?'Olá! Estou online e pronta para conversar com você.':/quem.*você|quem.*voce/i.test(t)?'Eu sou a IA Esfera, um protótipo visual interativo.':answers[Math.floor(Math.random()*answers.length)];speak(a)},850)}send.onclick=()=>processText(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter')processText(input.value)});const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.onstart=()=>setMode('listening');rec.onresult=e=>processText(e.results[0][0].transcript);rec.onerror=()=>setMode('idle');rec.onend=()=>{if(mode==='listening')setMode('idle')};mic.onclick=()=>{try{rec.start()}catch(e){}}}else mic.onclick=()=>{show('O reconhecimento de voz não está disponível neste navegador. Você pode escrever normalmente.');setTimeout(()=>reply.classList.remove('show'),3500)};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();</script></body></html>
